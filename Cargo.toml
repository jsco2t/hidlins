[workspace]
resolver = "2"
members = [
    "crates/hidlins-core",
    "crates/hidlins-security",
    "crates/hidlins-genpw",
    "crates/hidlins-sync",
    "crates/hidlins-api",
    "crates/hidlins-cli",
    "crates/hidlins-tui",
    "crates/hidlins-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Jason <jsco2t@gmail.com>"]
repository = "https://github.com/jsco2t/hidlins"
# flutter_rust_bridge triple-pin (design §2.6): the runtime crate
# (hidlins-api Cargo.toml), the Dart pub package (app/pubspec.yaml),
# and the codegen CLI tool (install-toolchain.sh) MUST all be pinned
# to the SAME version. Current pin: 2.12.0
#
# MSRV pinned to 1.89 — the release that stabilized std::fs::File::{lock,
# lock_shared, try_lock, try_lock_shared, unlock} and `std::fs::TryLockError`,
# which `hidlins-core::locking` uses directly (replacing the previous `fs2`
# dependency, design §3.3 deviation recorded inline in `locking.rs`).
rust-version = "1.89"

[workspace.lints.rust]
# `deny` (not `forbid`) so test-only code can opt in to unsafe (volatile
# reads in zeroize-verification tests; std::env::set_var in env-mutating
# tests). Production code in each crate root re-asserts `forbid` via
# `#![cfg_attr(not(test), forbid(unsafe_code))]` — see crates/hidlins-core/src/lib.rs.
unsafe_code = "deny"

# `frb_expand` is set by the `flutter_rust_bridge::frb` attribute macro when it
# expands (e.g. `#[frb(sync)]` in hidlins-api). Declaring it here keeps
# `unexpected_cfgs` ACTIVE for every other cfg in the workspace — hidlins-api
# previously suppressed the lint crate-wide, which would have silently accepted
# a typo'd `#[cfg(feature = "desktop")]` on the security-critical cfg gates that
# compile `take_secret_for_clipboard` out of desktop builds.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
