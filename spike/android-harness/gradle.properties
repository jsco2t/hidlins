# Mirrors app/android/gradle.properties' AGP/Kotlin DSL flags (useAndroidX,
# newDsl, builtInKotlin) so the spike validates the same AGP 9 configuration
# surface T8.1 will use. JVM heap settings are deliberately smaller than
# production's (-Xmx8G) — they affect the build daemon only, not findings.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
