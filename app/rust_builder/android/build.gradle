plugins {
    id 'com.android.library'
}

group 'com.flutter_rust_bridge.hidlins_api'
version '1.0'

android {
    namespace 'com.flutter_rust_bridge.hidlins_api'
    compileSdk 36
    ndkVersion '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 29
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    sourceSets {
        main {
            // Make owns Rust compilation. Gradle consumes only the checked
            // two-ABI staging contract and never invokes legacy Cargokit.
            jniLibs.srcDirs rootProject.file('native-artifacts/jniLibs')
        }
    }
}

def verifyHidlinsNativeArtifacts = tasks.register('verifyHidlinsNativeArtifacts', Exec) {
    workingDir rootProject.file('../..')
    commandLine 'python3', 'tools/android-native/artifacts.py', 'check'
}

tasks.named('preBuild') {
    dependsOn verifyHidlinsNativeArtifacts
}
