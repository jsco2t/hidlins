# Hidlins CI.
#
# Build, lint, test, docs, supply-chain checks, and KeePassXC interop all run
# through the top-level Makefile so local and CI workflows stay aligned.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo. Nothing here pushes,
# comments, or publishes; if a future job needs more, grant it per-job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  vault-core:
    name: vault-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - name: Install KeePassXC CLI (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/keepassxreboot/keepassxc/releases/download/2.7.12/KeePassXC-2.7.12-x86_64.AppImage -o "$RUNNER_TEMP/keepassxc.AppImage"
          echo "564fe8b751b9ef7aa057e4d3d0b2878db24eaa0f6b1c855c82e699ab0913ae49  $RUNNER_TEMP/keepassxc.AppImage" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/keepassxc.AppImage"
          cd "$RUNNER_TEMP"
          ./keepassxc.AppImage --appimage-extract >/dev/null
          sudo mv squashfs-root /opt/keepassxc-2.7.12
          sudo ln -s /opt/keepassxc-2.7.12/usr/bin/keepassxc-cli /usr/local/bin/keepassxc-cli

      - name: Install KeePassXC CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask keepassxc
          if ! command -v keepassxc-cli >/dev/null 2>&1; then
            sudo ln -s /Applications/KeePassXC.app/Contents/MacOS/keepassxc-cli /usr/local/bin/keepassxc-cli
          fi

      - name: Check KeePassXC CLI
        run: keepassxc-cli --version

      - name: Install cargo-deny
        working-directory: /tmp
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.95.0"
        run: cargo install --locked cargo-deny --version 0.19.6

      - name: Install cargo-audit
        working-directory: /tmp
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.95.0"
        run: cargo install --locked cargo-audit --version 0.22.1

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # Type-check the platform-gated os_events modules (iokit via the
      # apple cross-targets, natively on the macOS leg) — the drift gate
      # `make check` bundles locally.
      - name: macOS os_events drift gate
        run: make check-macos

      # Compile the feature-gated test suites (clipboard, OS-event
      # helpers) that no runtime CI sweep builds, so refactors can't
      # silently break them.
      - name: Feature-gated test compile gate
        run: make check-feature-gates

      - name: Shell completions drift gate
        run: make completions-check

      - name: Test
        run: make test

      - name: Ignored tests
        run: make test-ignored

      - name: API docs
        run: make doc

      - name: Supply-chain policy check
        run: make deny

      - name: RustSec advisory check
        run: make audit

      - name: KeePassXC interop (vault-core)
        run: make interop

      - name: Install oathtool (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y oathtool

      - name: Install oathtool (macOS)
        if: runner.os == 'macOS'
        run: brew install oath-toolkit

      - name: KeePassXC interop (entry-management)
        run: make interop-entry

      - name: KeePassXC interop (sync merge / US-044)
        run: make interop-sync

      - name: KeePassXC interop (desktop API boundary)
        run: make interop-app

      - name: NFR-002 search benchmark gate
        # Hosted runners gate the median with hardware/noise headroom and
        # report p99. Controlled local hardware retains the strict p99 gate.
        run: make bench-search-gate-ci

      - name: Informational benchmark
        continue-on-error: true
        run: make bench

  # MinIO live-wire integration (s3-sync T6.2). Linux-only: GitHub's
  # macOS runners have no Docker, so the #[ignore]-gated MINIO-* tests
  # can't run there (the `vault-core` job's individual make targets all
  # skip them — the MINIO cases only compile under `--features
  # minio-tests`). Uses the same make targets as local dev, so CI and
  # local runs are identical (CLAUDE.md CI/dev-parity rule).
  integration-s3:
    name: integration-s3 (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - name: Install Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable

      - name: Install MinIO client (mc)
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/archive/mc.RELEASE.2025-08-13T08-35-41Z -o "$RUNNER_TEMP/mc"
          echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  $RUNNER_TEMP/mc" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/mc"
          sudo mv "$RUNNER_TEMP/mc" /usr/local/bin/mc
          mc --version

      - name: Start MinIO
        run: make minio-up

      - name: S3 integration tests (MINIO-*)
        run: make test-s3-integration

      - name: Disable Flutter telemetry
        run: tools/dev/telemetry-check.sh --write

      - name: Desktop two-session sync integration
        run: make app-test-integration-minio

      - name: Stop MinIO
        if: always()
        run: make minio-down

  # Android cross-compile gate (flutter-app P6 / T6.1). This ubuntu job is
  # the Linux-host half of the both-hosts requirement (spike go/no-go
  # criterion WM-8); the macOS half is validated on developer machines and
  # recorded in the spike memo. The NDK is the runner image's preinstalled
  # default (ANDROID_NDK_HOME is preset on ubuntu images) — the spike
  # validated NDK r30-beta1 locally and any r26+ is expected to work; an
  # exact NDK pin is deferred to T8.1 with the productionized Android build
  # (sdkmanager cannot reliably install a specific NDK across channels, and
  # a hard-coded version would break whenever the image retires it). The
  # version-echo step keeps the exact NDK used in every run's log.
  # HIDLINS_ANDROID_STRICT=1 turns the make targets' graceful NDK-unset
  # skip into a hard failure so an image/tooling change can never silently
  # skip this gate. `build-android` (not just check) is deliberate: it is
  # the full `ring` C-compile + cdylib link proof plus the JNI-export
  # symbol assertion.
  check-android:
    name: check-android (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - name: Report NDK version
        run: |
          test -n "$ANDROID_NDK_HOME" || { echo "runner image no longer presets ANDROID_NDK_HOME" >&2; exit 1; }
          cat "$ANDROID_NDK_HOME/source.properties"

      # build-android alone: it is a strict superset of check-android
      # (cargo check shares no artifacts with cargo build, so running both
      # would compile the whole graph twice per triple for no added
      # coverage), and it carries the JNI-export symbol assertion + the
      # single-verifier-instance gate.
      - name: Android cross-compile build (ring compile + link + ABI gates)
        run: make build-android HIDLINS_ANDROID_STRICT=1

  # Flutter app — analyze, format, build, codegen + supply-chain gates on
  # both supported desktop platforms. Goldens execute on the Linux leg only.
  #
  # Every assertion runs through a `make` target so CI and `make app-check`
  # cannot drift (CLAUDE.md build-system rule). Only runner provisioning is
  # raw, matching the precedent set by the vault-core job.
  flutter-app:
    name: flutter-app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - name: Install Flutter SDK
        # Pinned to a full commit SHA: this is a THIRD-PARTY action running in
        # a job with the repository checked out, and a mutable tag would let
        # its owner change what executes here (repo "pinned exact versions"
        # rule). To upgrade: review the diff between the pinned SHA and the
        # new release on github.com/subosito/flutter-action, then update SHA
        # and version comment together. (GitHub-official actions like
        # actions/checkout stay tag-pinned by existing convention.)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libgtk-3-dev

      - name: Install codegen tooling (pinned)
        working-directory: /tmp
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.95.0"
        run: |
          cargo install --locked cargo-expand --version 1.0.124
          cargo install --locked flutter_rust_bridge_codegen --version 2.12.0

      - name: Disable telemetry (NFR-013)
        run: tools/dev/telemetry-check.sh --write

      # Flutter version assert, telemetry gate, pub resolve + byte-level
      # cache integrity, analyze, format, widget tests, Dart↔Rust bridge
      # smoke tests (needs the Rust toolchain installed above), codegen
      # drift, pub vendor drift.
      - name: Flutter gates
        run: make app-check

      - name: Install pinned native MinIO tools (macOS)
        if: runner.os == 'macOS'
        run: |
          case "$(uname -m)" in
            arm64)
              minio_arch=arm64
              minio_sha256=7c3b3039b76e55a1b80935848ed83998d5e8d317374f87851f46a019ff5c0aa4
              mc_sha256=a877fd0c183409da9f20f9d6e1811987298bbbca1aa03428eebdffba79fb9445
              ;;
            x86_64)
              minio_arch=amd64
              minio_sha256=4759080aeef7385aaceaac1131c30aaeb99605921553967dc6d3ef4e16ac64f9
              mc_sha256=2862c79cce11b09be9a8911a279b2e9465bebf74b9f01abca9c348a0d795f0cb
              ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          curl -fsSL "https://dl.min.io/server/minio/release/darwin-${minio_arch}/archive/minio.RELEASE.2025-09-07T16-13-09Z" -o "$RUNNER_TEMP/minio"
          curl -fsSL "https://dl.min.io/client/mc/release/darwin-${minio_arch}/archive/mc.RELEASE.2025-08-13T08-35-41Z" -o "$RUNNER_TEMP/mc"
          echo "${minio_sha256}  $RUNNER_TEMP/minio" | shasum -a 256 -c -
          echo "${mc_sha256}  $RUNNER_TEMP/mc" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/minio" "$RUNNER_TEMP/mc"
          sudo mv "$RUNNER_TEMP/minio" "$RUNNER_TEMP/mc" /usr/local/bin/
          minio --version
          mc --version

      - name: Start native MinIO (macOS)
        if: runner.os == 'macOS'
        run: make minio-native-up

      - name: Desktop two-session sync integration (macOS)
        if: runner.os == 'macOS'
        run: make app-test-integration-minio

      - name: Stop native MinIO (macOS)
        if: always() && runner.os == 'macOS'
        run: make minio-native-down

      - name: Build Linux app
        if: runner.os == 'Linux'
        run: make app-build-linux

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: make app-build-macos

      - name: Boundary check
        run: make boundary-check
